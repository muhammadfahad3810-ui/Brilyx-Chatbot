[project]
name = "brilyx-chatbot"
version = "0.1.0"
description = "Brilyx AI website chatbot — FastAPI backend + dependency-free embeddable widget"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend", "backend.app", "backend.app.routers", "backend.app.ai", "backend.app.services", "backend.app.intelligence", "backend.app.qualification", "backend.app.leads", "backend.app.events"]
